name: One-time encrypted account export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/account-export.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Read current holdings
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
        run: python account_export.py
      - name: Encrypt holdings
        run: |
          openssl cms -encrypt -binary -aes256 \
            -in output/account_holdings.json \
            -out output/account_holdings.p7m \
            -outform DER \
            config/account_export_public.crt
          base64 -w 0 output/account_holdings.p7m > output/account_holdings.b64
          rm output/account_holdings.json
      - name: Publish encrypted payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "One-time encrypted NH holdings export."
            echo
            echo "Certificate fingerprint: D5:4A:FF:F3:61:58:EF:DB:A9:45:8D:17:D8:41:9A:A4:6C:3A:C8:E7:7D:14:CF:BE:68:5B:8B:18:67:5C:6B:99"
            echo
            echo '~~~'
            fold -w 120 output/account_holdings.b64
            echo '~~~'
          } > output/encrypted_issue.md
          gh issue create \
            --title "PRIVATE ACCOUNT EXPORT ${{ github.run_id }}" \
            --body-file output/encrypted_issue.md \
            --assignee sknixbot
