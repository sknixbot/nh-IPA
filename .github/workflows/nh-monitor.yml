
name: NH PLUG Morning Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nh-monitor.yml"
  workflow_dispatch:

  schedule:
    # 한국 월~금 08:00 = UTC 전날 23:00
    - cron: "0 23 * * 0-4"
    # 한국 월~금 09:00 = UTC 00:00
    - cron: "0 0 * * 1-5"

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Diagnose NH credentials
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
        run: |
          printf 'NH_APP_KEY present: %s, length: %s (expected 32)\n' \
            "$([[ -n "$NH_APP_KEY" ]] && echo true || echo false)" "${#NH_APP_KEY}"
          printf 'NH_APP_SECRET present: %s, length: %s (expected 44)\n' \
            "$([[ -n "$NH_APP_SECRET" ]] && echo true || echo false)" "${#NH_APP_SECRET}"
      - name: Query encrypted holdings
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
        run: python query_holdings_once.py
      - name: Upload encrypted holdings
        uses: actions/upload-artifact@v4
        with:
          name: holdings-encrypted-${{ github.run_id }}
          path: output/holdings.enc
          retention-days: 1
