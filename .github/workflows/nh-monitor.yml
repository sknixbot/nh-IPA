
name: NH PLUG Secure Holdings Lookup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nh-monitor.yml"

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Query encrypted holdings
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
        run: python query_holdings_once.py
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: holdings-encrypted-${{ github.run_id }}
          path: output/holdings.enc
          retention-days: 1
