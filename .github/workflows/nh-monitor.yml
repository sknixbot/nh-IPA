
name: NH PLUG Secure SNDK Lookup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nh-monitor.yml"

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Query and encrypt SNDK position
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
        run: |
          python query_sndk_once.py
          openssl pkeyutl -encrypt -pubin \
            -inkey sndk_lookup_public.pem \
            -in output/sndk.json \
            -out output/sndk.enc
          rm output/sndk.json

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: sndk-encrypted-${{ github.run_id }}
          path: output/sndk.enc
          retention-days: 1
