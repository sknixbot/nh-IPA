name: Realtime Bollinger Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bollinger-monitor.yml"
      - "bollinger*.py"
      - "config/bollinger_watchlist.json"
      - "alerts.py"
      - "main.py"
  workflow_dispatch:
    inputs:
      minutes:
        description: "시간당 감시 창(분, 0은 Actions에서 사용 금지)"
        required: false
        default: "10"
  schedule:
    # 24시간, 매시 7분에 국내·미국을 한 번씩 점검한다.
    # 정각의 GitHub Actions 예약 부하를 피하기 위해 7분으로 분산한다.
    - cron: "7 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: realtime-bollinger-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Select session duration
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MINUTES: ${{ inputs.minutes }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            MINUTES=5
            MARKETS="KR,US"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            MINUTES="${MANUAL_MINUTES:-10}"
            MARKETS="KR,US"
          else
            MINUTES=10
            MARKETS="KR,US"
          fi
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || (( MINUTES < 1 || MINUTES > 20 )); then
            echo "minutes must be between 1 and 20" >&2
            exit 2
          fi
          echo "minutes=$MINUTES" >> "$GITHUB_OUTPUT"
          echo "markets=$MARKETS" >> "$GITHUB_OUTPUT"
      - name: Monitor Bollinger bands
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python main.py --bollinger
          --minutes "${{ steps.duration.outputs.minutes }}"
          --markets "${{ steps.duration.outputs.markets }}"
