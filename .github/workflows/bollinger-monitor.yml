name: Realtime Bollinger Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bollinger-monitor.yml"
      - "bollinger*.py"
      - "config/bollinger_watchlist.json"
      - "alerts.py"
      - "main.py"
  workflow_dispatch:
    inputs:
      minutes:
        description: "감시 시간(분, 0은 무제한이므로 Actions에서는 사용 금지)"
        required: false
        default: "30"
  schedule:
    # 국내 정규장: KST 월~금 08:50~15:45, 두 구간으로 분할
    - cron: "50 23 * * 0-4"
    - cron: "30 5 * * 1-5"
    # 미국 프리·정규·애프터: DST/표준시를 모두 덮도록 UTC 고정 3구간
    - cron: "50 7 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "10 19 * * 1-5"
    # 미국 표준시 애프터마켓 마지막 구간(미국 월~금 = UTC 화~토)
    - cron: "5 0 * * 2-6"

permissions:
  contents: read
  issues: write

concurrency:
  group: realtime-bollinger-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Select session duration
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MINUTES: ${{ inputs.minutes }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            MINUTES=5
            MARKETS="KR,US"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            MINUTES="${MANUAL_MINUTES:-30}"
            MARKETS="KR,US"
          else
            case "$SCHEDULE" in
              "50 23 * * 0-4") MINUTES=340; MARKETS="KR" ;;
              "30 5 * * 1-5") MINUTES=75; MARKETS="KR" ;;
              "50 7 * * 1-5") MINUTES=335; MARKETS="US" ;;
              "30 13 * * 1-5") MINUTES=340; MARKETS="US" ;;
              "10 19 * * 1-5") MINUTES=300; MARKETS="US" ;;
              "5 0 * * 2-6") MINUTES=75; MARKETS="US" ;;
              *) MINUTES=30; MARKETS="KR,US" ;;
            esac
          fi
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || (( MINUTES < 1 || MINUTES > 340 )); then
            echo "minutes must be between 1 and 340" >&2
            exit 2
          fi
          echo "minutes=$MINUTES" >> "$GITHUB_OUTPUT"
          echo "markets=$MARKETS" >> "$GITHUB_OUTPUT"
      - name: Monitor Bollinger bands
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python main.py --bollinger
          --minutes "${{ steps.duration.outputs.minutes }}"
          --markets "${{ steps.duration.outputs.markets }}"
