name: One-time encrypted account export 0918b
on:
  push:
    branches: [main]
    paths: [".github/workflows/account-export-0918b.yml"]
permissions:
  contents: read
  issues: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read current holdings
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
        run: python account_export_0918b.py
      - name: Encrypt and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          openssl cms -encrypt -binary -aes256 \
            -in output/account_holdings_0918b.json \
            -out output/account_holdings_0918b.p7m -outform DER \
            config/account_export_public_0918b.crt
          base64 -w 0 output/account_holdings_0918b.p7m > output/account_holdings_0918b.b64
          rm output/account_holdings_0918b.json
          {
            echo "One-time encrypted NH holdings export 0918b."
            echo
            echo "Certificate fingerprint: 6A:AA:C1:03:DD:16:C2:E4:E2:E6:5C:99:70:1A:22:D1:26:71:BA:2E:44:2F:EA:1A:B4:61:4E:DE:AB:25:E8:44"
            echo
            echo '~~~'
            fold -w 120 output/account_holdings_0918b.b64
            echo '~~~'
          } > output/encrypted_issue_0918b.md
          gh issue create --title "PRIVATE ACCOUNT EXPORT 0918b ${{ github.run_id }}" \
            --body-file output/encrypted_issue_0918b.md --assignee sknixbot

# retrigger current balance export
