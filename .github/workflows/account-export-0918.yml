name: One-time encrypted account export 0918
on:
  push:
    branches: [main]
    paths: [".github/workflows/account-export-0918.yml"]
permissions:
  contents: read
  issues: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read current holdings
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
        run: python account_export_0918.py
      - name: Encrypt and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          openssl cms -encrypt -binary -aes256 \
            -in output/account_holdings_0918.json \
            -out output/account_holdings_0918.p7m -outform DER \
            config/account_export_public_0918.crt
          base64 -w 0 output/account_holdings_0918.p7m > output/account_holdings_0918.b64
          rm output/account_holdings_0918.json
          {
            echo "One-time encrypted NH holdings export 0918."
            echo
            echo "Certificate fingerprint: 7C:3D:86:35:05:4F:F6:D4:60:21:64:27:93:3A:17:EA:EA:47:E6:F6:95:47:AD:B4:E9:77:43:80:B3:53:A7:41"
            echo
            echo '~~~'
            fold -w 120 output/account_holdings_0918.b64
            echo '~~~'
          } > output/encrypted_issue_0918.md
          gh issue create --title "PRIVATE ACCOUNT EXPORT 0918 ${{ github.run_id }}" \
            --body-file output/encrypted_issue_0918.md --assignee sknixbot
